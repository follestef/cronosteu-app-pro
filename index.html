<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CronoPro</title>
  <link rel="manifest" href="manifest.json?v=4">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CronoPro">
  <link rel="apple-touch-icon" href="icon-512.png?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; padding: 8px 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
    .display { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    #lap-counter { font-size: 17px; color: #00e676; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
    #sub-info { font-size: 13px; color: #ffeb3b; text-transform: uppercase; font-weight: bold; margin-bottom: 3px; }
    #sync-status-bar { display: none; background: #ff9100; color: #000; font-size: 11px; font-weight: 900; padding: 3px 10px; border-radius: 12px; margin-bottom: 3px; cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase; }
    #main-time { font-size: 62px; font-weight: 900; font-family: 'monospace'; margin: 0; line-height: 1; color: #fff; }
    #intertempo { font-size: 18px; color: #00e5ff; font-family: 'monospace'; height: 42px; margin-top: 4px; font-weight: bold; line-height: 1.15; }
    
    /* GRAFICO A LINEE TREND SEQUENZA GIRI (SOPRA IL DELTA) */
    #lap-chart-box { width: 100%; height: 42px; background: #0d0d0d; border: 1px solid #262626; border-radius: 8px; margin-bottom: 5px; padding: 3px 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-family: monospace; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1; }
    #chart-title { color: #888; }
    #chart-trend-badge { color: #666; }
    #lap-sparkline { width: 100%; height: 24px; display: block; overflow: visible; }

    /* DELTA CUMULATIVO LIVE SOPRA LE BARRETTE */
    #lap-delta { font-size: 15px; font-weight: 900; font-family: monospace; text-align: center; color: #666; letter-spacing: 1px; height: 19px; line-height: 19px; margin-bottom: 5px; text-transform: uppercase; }

    /* BARRETTE PERFORMANCE SETTORI CON ETICHETTA S1-S8 (MAX 8 SPLIT) */
    .sector-bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-bottom: 7px; width: 100%; }
    .sec-bar { height: 20px; border-radius: 6px; background: #1c1c1c; border: 1px solid #333; color: #666; font-size: 11px; font-weight: 900; font-family: monospace; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr; background: #111; border: 1px solid #333; border-radius: 10px; padding: 6px 8px; margin-bottom: 8px; }
    .stat-box { text-align: center; } .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; } .stat-val { font-size: 17px; font-weight: bold; font-family: monospace; }
    .action-grid, .rival-action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
    .btn { width: 100%; border-radius: 20px; color: #fff; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; position: relative; }
    .split-btn { height: 112px; font-size: 31px; background: #2979ff; box-shadow: 0 5px 0 #1565c0; }
    .lap-btn { height: 112px; font-size: 42px; background: #d50000; box-shadow: 0 5px 0 #b71c1c; }
    .r-split-giant { height: 112px; font-size: 25px; background: #1976d2; box-shadow: 0 5px 0 #0d47a1; }
    .r-lap-giant { height: 112px; font-size: 31px; background: #b71c1c; box-shadow: 0 5px 0 #7f0000; }
    .rival-container { display: flex; gap: 10px; margin-bottom: 8px; width: 100%; }
    .rival-input { width: 30%; height: 62px; border-radius: 20px; background: #000; color: #fff; border: 2px solid #555; text-align: center; font-size: 1.4rem; font-weight: bold; font-family: monospace; }
    .rival-btn { flex: 1; height: 62px; background: #7cc2f2; color: #000; font-size: 19px; border-radius: 40px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 0 #5a9bc7; margin: 0; font-weight: 900; }
    .bottom-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .home-btn { height: 50px; background: #ff9800; font-size: 15px; color: #fff; }
    .stop-btn { height: 50px; background: #c62828; font-size: 17px; }
    .reset-btn { height: 50px; background: #444; font-size: 15px; }
    
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 6000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .login-input { width: 100%; max-width: 320px; height: 50px; background: #222; border: 2px solid #ff9800; border-radius: 15px; color: #fff; text-align: center; font-size: 1.3rem; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }

    #mechanic-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5000; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; display: none; }
    .team-logo { max-width: 110px; max-height: 90px; border-radius: 15px; padding: 5px; margin-bottom: 8px; object-fit: contain; }
    #mechanic-overlay h2 { color: #ff9800; font-size: 1.6rem; margin: 0 0 8px 0; text-transform: uppercase; font-weight: 900; }
    .overlay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 380px; margin-bottom: 10px; }
    .square-box { height: 92px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; border: none; cursor: pointer; position: relative; color: white; text-transform: uppercase; }
    .square-box i { font-size: 1.7rem; margin-bottom: 4px; } .square-box select { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .bg-blue { background: #3498db; } .bg-orange { background: #e67e22; } .bg-green { background: #27ae60; } .bg-purple { background: #9b59b6; } .bg-red { background: #e74c3c; } .bg-yellow { background: #f1c40f; color: black !important; }
    
    .wide-voice-bar { width: 100%; max-width: 380px; height: 50px; background: #222; border: 2px dashed #ff3d00; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; margin-bottom: 10px; box-sizing: border-box; transition: all 0.3s ease; }
    .wide-voice-bar i { font-size: 1.3rem; color: #ff3d00; }
    #voice-status { font-size: 12px; color: #fff; font-weight: bold; text-transform: uppercase; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .listening-active { background: #ff1744 !important; border: 2px solid #fff !important; animation: pulseBar 1.5s infinite; }
    .listening-active i, .listening-active #voice-status { color: #fff !important; }
    @keyframes pulseBar { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

    .remote-sheet-bar { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px; width: 100%; max-width: 380px; margin-bottom: 10px; }
    .btn-sheet-save { height: 46px; border-radius: 12px; background: #00897b; color: #fff; border: none; font-weight: 900; font-size: 11px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-sheet-both { height: 46px; border-radius: 12px; background: #1976d2; color: #fff; border: 1px solid #64b5f6; font-weight: 900; font-size: 11px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-sheet-clear { height: 46px; border-radius: 12px; background: #b71c1c; color: #fff; border: none; font-weight: 900; font-size: 11px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
    
    .btn-logout { position: absolute; top: 15px; right: 15px; background: #333; color: #ff5252; border: 1px solid #ff5252; border-radius: 10px; padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <select id="pilota" style="display:none;"></select> 
  <input type="hidden" id="sessione">
  <input type="hidden" id="nota-vocale-testo" value="">

  <!-- 🔐 OVERLAY DI LOGIN -->
  <div id="login-overlay">
    <h2 style="color: #fff; font-weight: 900; letter-spacing: 1px;">CRONOSTEU PRO</h2>
    <img src="https://i.postimg.cc/34nxWxHr/b4c7793b-5a42-423c-9991-b5bb88d8b1a2.jpg" style="max-width: 160px; margin-bottom: 25px; border-radius: 15px;">
    <input type="text" id="codice-scuderia-input" class="login-input" placeholder="CODICE SCUDERIA">
    <button class="square-box bg-yellow" style="width: 100%; max-width: 320px; height: 55px;" onclick="autenticaLicenza()"><i class="fa-solid fa-unlock-keyhole"></i><span>SBLOCCA APPLICAZIONE</span></button>
  </div>

  <!-- 🛰️ OVERLAY PADDOCK -->
  <div id="mechanic-overlay">
    <button class="btn-logout" onclick="disconnettiScuderia()"><i class="fa-solid fa-power-off"></i> RESET LICENZA</button>
    <h2 id="titolo-paddock">PADDOCK</h2>
    <img id="logo-dinamico-team" src="" class="team-logo">
    
    <div class="overlay-grid">
      <div class="square-box bg-blue"><i class="fa-solid fa-wrench"></i><span id="label-mechanic">MECCANICO</span><select id="mechanic-select" onchange="updateOverlayLabel('mechanic')"><option value="" disabled selected>SCEGLI...</option></select></div>
      <div class="square-box bg-orange"><i class="fa-solid fa-tags"></i><span id="label-category">CATEGORIA</span><select id="category-select" onchange="updateOverlayLabel('category')"><option value="" disabled selected>SCEGLI...</option></select></div>
      <div class="square-box bg-green"><i class="fa-solid fa-map-marked-alt"></i><span id="label-track">PISTA</span><select id="track-select" onchange="updateOverlayLabel('track')"><option value="" disabled selected>SCEGLI...</option></select></div>
      <div class="square-box bg-purple"><i class="fa-solid fa-user-astronaut"></i><span id="label-driver">PILOTA</span><select id="driver-select" onchange="updateOverlayLabel('driver')"><option value="" disabled selected>SCEGLI...</option></select></div>
      <div class="square-box bg-red" style="grid-column: span 2; height: 78px;"><i class="fa-solid fa-flag-checkered"></i><span id="label-session">TIPO PROVA</span><select id="session-select" onchange="updateOverlayLabel('session')"><option value="" disabled selected>SCEGLI...</option></select></div>
    </div>
    
    <div class="wide-voice-bar" id="voice-bar-btn" onclick="toggleVoiceRecognition();">
      <i class="fa-solid fa-microphone" id="mic-icon"></i>
      <span id="voice-status">PREMI E DETTA NOTE ASSETTO</span>
    </div>

    <div class="remote-sheet-bar">
      <button class="btn-sheet-save" onclick="comandoFoglioRemoto('salvaFoglioTeam')"><i class="fa-solid fa-floppy-disk"></i> SALVA</button>
      <button class="btn-sheet-both" onclick="comandoFoglioRemoto('salvaECancellaFoglioTeam')"><i class="fa-solid fa-rotate"></i> SALVA + PULISCI</button>
      <button class="btn-sheet-clear" onclick="comandoFoglioRemoto('cancellaFoglioTeam')"><i class="fa-solid fa-trash-can"></i> CANCELLA</button>
    </div>
    
    <button class="square-box bg-yellow" style="width: 100%; max-width: 380px; height: 56px;" onclick="confirmOverlayAll()"><i class="fa-solid fa-play"></i><span>ENTRA IN PISTA</span></button>
  </div>

  <!-- INTERFACCIA CRONOMETRO -->
  <div class="display">
    <div id="lap-counter">GIRO 0</div>
    <div id="sub-info">PRONTO</div>
    <div id="sync-status-bar" onclick="sincronizzaCodaOffline(true)"></div>
    <div id="main-time">00:00.000</div>
    <div id="intertempo">--:--.---</div>
  </div>

  <!-- 📊 GRAFICO A LINEE TREND SEQUENZA GIRI (PRESSIONI / PASSO) -->
  <div id="lap-chart-box">
    <div class="chart-header">
      <span id="chart-title">TREND GIRI</span>
      <span id="chart-trend-badge">IN ATTESA 1° GIRO</span>
    </div>
    <svg id="lap-sparkline" viewBox="0 0 320 24" preserveAspectRatio="none"></svg>
  </div>

  <!-- 📈 GUADAGNO / PERDITA CUMULATIVA SUL GIRO -->
  <div id="lap-delta">DELTA: --.---</div>

  <!-- 🚦 8 BARRETTE SETTORI CON ETICHETTE S1-S8 -->
  <div class="sector-bars" id="sector-bars">
    <div class="sec-bar" id="sec-1">S1</div>
    <div class="sec-bar" id="sec-2">S2</div>
    <div class="sec-bar" id="sec-3">S3</div>
    <div class="sec-bar" id="sec-4">S4</div>
    <div class="sec-bar" id="sec-5">S5</div>
    <div class="sec-bar" id="sec-6">S6</div>
    <div class="sec-bar" id="sec-7">S7</div>
    <div class="sec-bar" id="sec-8">S8</div>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-label">Best Lap</div><div id="best-val" style="color:#ffeb3b">--:--.---</div></div>
    <div class="stat-box"><div class="stat-label">Ideal Lap</div><div id="ideal-val" style="color:#00e5ff">--:--.---</div></div>
  </div>
  <div class="action-grid">
    <button class="btn split-btn" onclick="press('Split')">SPLIT</button> <button class="btn lap-btn" onclick="press('Lap1')">LAP</button>
  </div>
  <div class="rival-container" id="rival-input-bar">
    <input type="number" id="rival-input" class="rival-input" placeholder="N°" inputmode="numeric" pattern="[0-9]*"> <button class="btn rival-btn" onclick="press('RivalStart')">RIVAL START</button>
  </div>
  <div class="rival-action-grid" id="rival-giant-grid" style="display: none;">
    <button class="btn r-split-giant" onclick="press('RivalSplit')"><span id="r-split-label">R-SPLIT</span><br><span id="r-split-box" style="font-size: 20px; font-family: monospace; color: #ffeb3b;">--:--.---</span></button> <button class="btn r-lap-giant" onclick="press('RivalLap')">R-LAP<br><span id="r-lap-box" style="font-size: 22px; font-family: monospace; color: #fff;">00:00.000</span></button>
  </div>
  <div class="bottom-bar">
    <button class="btn home-btn" onclick="press('Home')"><i class="fa-solid fa-house"></i> HOME</button> <button class="btn stop-btn" onclick="press('Stop')">STOP</button> <button class="btn reset-btn" onclick="press('Reset')">RESET</button>
  </div>

  <audio id="beep" src="https://actions.google.com/sounds/v1/states/notification.ogg"></audio>

  <script>
    const MASTER_URL = "https://script.google.com/macros/s/AKfycbw2POXGLhrmEgZ0Q8nBW6MC56pudFZNvGsGDwZjmPZovnNkIo0tyCWbcC4V8yCcokBO/exec";
    const QUEUE_KEY = "cronopro_offline_queue";
    
    let tInizio = 0, tUltimo = 0, splitCount = 0, lapCount = 0, localRecords = {}, varMechanic = "", varCategory = "", varTrack = "", tRivalInizio = 0, tRivalUltimo = 0, rivalSplitCount = 0;
    let recognition = null, isListening = false, codiceScuderiaAttivo = "";
    let rivalNumeroAttivo = "";
    let resetBarsTimer = null;
    let currentLapCum = {}, bestLapCum = {};
    let lapHistory = [];
    let isSyncing = false;

    /* 📊 RENDERING GRAFICO TREND GIRI (SVG ULTRA-LEGGERO) */
    function aggiornaGraficoGiri() {
      const svg = document.getElementById('lap-sparkline');
      const titleEl = document.getElementById('chart-title');
      const badgeEl = document.getElementById('chart-trend-badge');
      if (!svg || !titleEl || !badgeEl) return;

      if (lapHistory.length === 0) {
        svg.innerHTML = '<line x1="6" y1="12" x2="314" y2="12" stroke="#222" stroke-width="1" stroke-dasharray="4 4" />';
        titleEl.innerText = "TREND GIRI";
        badgeEl.innerText = "IN ATTESA 1° GIRO";
        badgeEl.style.color = "#666";
        return;
      }

      // Mostra gli ultimi 10 giri completati per mantenere i punti ben distanziati
      const dati = lapHistory.slice(-10);
      const primoGiro = dati[0].lap;
      const ultimoGiro = dati[dati.length - 1].lap;
      titleEl.innerText = dati.length === 1 ? "TREND (G" + ultimoGiro + ")" : "TREND G" + primoGiro + "-G" + ultimoGiro;

      if (dati.length === 1) {
        const d0 = dati[0];
        svg.innerHTML =
          '<line x1="6" y1="14" x2="314" y2="14" stroke="#00e676" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />' +
          '<circle cx="160" cy="14" r="4" fill="#00e676" stroke="#000" stroke-width="1" />';
        badgeEl.innerText = "G" + d0.lap + ": " + msToTime(d0.ms);
        badgeEl.style.color = "#00e676";
        return;
      }

      const times = dati.map(d => d.ms);
      const minMs = Math.min(...times);
      const maxMs = Math.max(...times);
      const span = (maxMs - minMs) || 1;

      const padX = 10;
      const padY = 4;
      const w = 320 - padX * 2;
      const h = 24 - padY * 2;

      // Y invertita rispetto ai ms: giro più veloce (minMs) in basso, giro più lento (maxMs) in alto
      const pts = dati.map((d, idx) => {
        const x = padX + (idx / (dati.length - 1)) * w;
        const norm = (d.ms - minMs) / span;
        const y = (padY + h) - norm * h;
        return { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)), ms: d.ms, lap: d.lap };
      });

      // Linea tratteggiata verde sul fondo = Best Lap dello stint
      let markup = '<line x1="' + padX + '" y1="' + (padY + h) + '" x2="' + (320 - padX) + '" y2="' + (padY + h) + '" stroke="#00e676" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3" />';

      // Segmenti colorati tra un giro e il successivo
      for (let i = 1; i < pts.length; i++) {
        const diffPrev = pts[i].ms - pts[i - 1].ms;
        let segColor = "#00e676";
        if (diffPrev > 250) {
          segColor = "#ff1744"; // Forte peggioramento / gomme oltre il picco
        } else if (diffPrev > 100) {
          segColor = "#ff9100"; // Peggioramento > 1 decimo
        } else if (diffPrev > 0) {
          segColor = "#ffffff"; // Stabile entro 1 decimo
        }
        markup += '<line x1="' + pts[i - 1].x + '" y1="' + pts[i - 1].y + '" x2="' + pts[i].x + '" y2="' + pts[i].y + '" stroke="' + segColor + '" stroke-width="2.4" stroke-linecap="round" />';
      }

      // Pallini sui singoli giri
      for (let i = 0; i < pts.length; i++) {
        let dotColor = "#00e676";
        if (i > 0) {
          const diffPrev = pts[i].ms - pts[i - 1].ms;
          if (diffPrev > 250) dotColor = "#ff1744";
          else if (diffPrev > 100) dotColor = "#ff9100";
          else if (diffPrev > 0) dotColor = "#ffffff";
        }
        const radius = (i === pts.length - 1) ? 4 : 2.8;
        markup += '<circle cx="' + pts[i].x + '" cy="' + pts[i].y + '" r="' + radius + '" fill="' + dotColor + '" stroke="#000" stroke-width="1" />';
      }

      svg.innerHTML = markup;

      // Badge destro: confronto immediato ultimo giro vs penultimo giro
      const lastDiff = pts[pts.length - 1].ms - pts[pts.length - 2].ms;
      const arrow = lastDiff < 0 ? "↘ " : (lastDiff > 0 ? "↗ " : "→ ");
      badgeEl.innerText = arrow + formatDelta(lastDiff) + " VS G" + pts[pts.length - 2].lap;
      if (lastDiff < 0) badgeEl.style.color = "#00e676";
      else if (lastDiff <= 100) badgeEl.style.color = "#ffffff";
      else if (lastDiff <= 250) badgeEl.style.color = "#ff9100";
      else badgeEl.style.color = "#ff1744";
    }

    /* 📡 GESTIONE STATO ONLINE/OFFLINE DEL PADDOCK */
    function aggiornaTitoloPaddockOnline(isOnline) {
      if (!codiceScuderiaAttivo) return;
      let titoloEl = document.getElementById('titolo-paddock');
      if (titoloEl) {
        titoloEl.innerText = codiceScuderiaAttivo + (isOnline ? "" : " (OFFLINE)");
      }
      if (tInizio === 0) {
        let subEl = document.getElementById('sub-info');
        if (subEl && (subEl.innerText === "MODALITÀ OFFLINE" || subEl.innerText === "OFFLINE" || subEl.innerText === "PRONTO" || subEl.innerText === "REGISTRATO")) {
          subEl.innerText = isOnline ? "PRONTO" : "MODALITÀ OFFLINE";
        }
      }
    }

    function verificaConnessioneERipulisciPaddock(ricaricaDati = true) {
      if (!codiceScuderiaAttivo) return;

      if (!navigator.onLine) {
        aggiornaTitoloPaddockOnline(false);
        return;
      }

      aggiornaTitoloPaddockOnline(true);

      if (ricaricaDati) {
        fetch(MASTER_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getAppData", codiceScuderia: codiceScuderiaAttivo })
        })
        .then(res => {
          if (!res.ok) throw new Error("Server non raggiungibile");
          return res.json();
        })
        .then(data => {
          if (!data || data.error) return;
          localStorage.setItem('saved_paddockData_' + codiceScuderiaAttivo, JSON.stringify(data));
          aggiornaTitoloPaddockOnline(true);
          if (tInizio === 0) {
            popolaPaddockDaDati(data, false, true);
          }
          sincronizzaCodaOffline(false);
        })
        .catch(() => {
          aggiornaTitoloPaddockOnline(false);
        });
      }
    }

    /* 📡 GESTIONE CODA OFFLINE E SINCRONIZZAZIONE */
    function getOfflineQueue() {
      try {
        return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveOfflineQueue(queue) {
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      aggiornaBarraSync();
    }

    function aggiornaBarraSync() {
      let bar = document.getElementById('sync-status-bar');
      if (!bar) return;
      let queue = getOfflineQueue();
      if (queue.length > 0) {
        bar.style.display = "inline-block";
        bar.style.background = "#ff9100";
        bar.style.color = "#000";
        bar.innerText = "📴 IN CODA OFFLINE: " + queue.length + " (TOCCA PER INVIARE)";
      } else {
        bar.style.display = "none";
      }
    }

    function accodaDatoOffline(payload) {
      let queue = getOfflineQueue();
      queue.push(payload);
      saveOfflineQueue(queue);
    }

    function inviaOAccodaDato(payload, onSuccess) {
      if (!navigator.onLine) {
        aggiornaTitoloPaddockOnline(false);
        accodaDatoOffline(payload);
        return;
      }
      fetch(MASTER_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => {
        if (!res.ok) throw new Error("Errore rete");
        return res.json();
      })
      .then(data => {
        aggiornaTitoloPaddockOnline(true);
        if (onSuccess) onSuccess(data);
        if (getOfflineQueue().length > 0) {
          sincronizzaCodaOffline(false);
        }
      })
      .catch(() => {
        aggiornaTitoloPaddockOnline(false);
        accodaDatoOffline(payload);
      });
    }

    async function sincronizzaCodaOffline(manuale = false) {
      let queue = getOfflineQueue();
      if (queue.length === 0) {
        aggiornaBarraSync();
        return;
      }
      if (!navigator.onLine) {
        aggiornaTitoloPaddockOnline(false);
        if (manuale) alert("Sei ancora offline. Riprova appena hai copertura internet o Wi-Fi in hotel!");
        return;
      }
      if (isSyncing) return;

      isSyncing = true;
      let bar = document.getElementById('sync-status-bar');

      while (queue.length > 0) {
        if (bar) {
          bar.style.display = "inline-block";
          bar.style.background = "#00e5ff";
          bar.style.color = "#000";
          bar.innerText = "🔄 INVIO DATI IN CORSO... (" + queue.length + ")";
        }
        try {
          let res = await fetch(MASTER_URL, {
            method: "POST",
            body: JSON.stringify(queue[0])
          });
          if (!res.ok) throw new Error("Errore server");
          let data = await res.json();
          aggiornaTitoloPaddockOnline(true);
          if (data && data.miglior) document.getElementById('best-val').innerText = data.miglior;
          if (data && data.ideal) document.getElementById('ideal-val').innerText = data.ideal;

          queue.shift();
          localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
        } catch (err) {
          break;
        }
      }

      isSyncing = false;
      if (queue.length === 0) {
        if (bar) {
          bar.style.display = "inline-block";
          bar.style.background = "#00e676";
          bar.style.color = "#000";
          bar.innerText = "✅ TUTTI I GIRI SINCRONIZZATI!";
          setTimeout(aggiornaBarraSync, 3000);
        }
      } else {
        aggiornaBarraSync();
      }
    }

    window.addEventListener('online', () => {
      verificaConnessioneERipulisciPaddock(true);
      sincronizzaCodaOffline(false);
    });

    window.addEventListener('offline', () => {
      aggiornaTitoloPaddockOnline(false);
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && codiceScuderiaAttivo) {
        verificaConnessioneERipulisciPaddock(true);

      }
    });

    function formatDelta(diffMs) {
      let sign = diffMs > 0 ? "+" : (diffMs < 0 ? "-" : "");
      let abs = Math.abs(diffMs);
      let secs = Math.floor(abs / 1000);
      let ms = abs % 1000;
      let msStr = (ms < 100 ? (ms < 10 ? '00' : '0') : '') + ms;
      return sign + secs + "." + msStr + "s";
    }

    function popolaPaddockDaDati(data, isOffline, mantieniSchermataAttuale = false) {
      let logoImmagine = data.logoTeam && data.logoTeam !== "" ? data.logoTeam : "https://i.postimg.cc/34nxWxHr/b4c7793b-5a42-423c-9991-b5bb88d8b1a2.jpg";
      document.getElementById('logo-dinamico-team').src = logoImmagine;
      aggiornaTitoloPaddockOnline(!isOffline);

      document.getElementById('pilota').innerHTML = ""; 
      document.getElementById('driver-select').innerHTML = '<option value="" disabled selected>PILOTA</option>';
      (data.piloti || []).forEach(n => { 
        let o1 = document.createElement('option'); o1.value = n; o1.text = n.toUpperCase(); document.getElementById('pilota').appendChild(o1);
        let o2 = document.createElement('option'); o2.value = n; o2.text = n.toUpperCase(); document.getElementById('driver-select').appendChild(o2);
      });
      
      document.getElementById('mechanic-select').innerHTML = '<option value="" disabled selected>MECCANICO</option>'; 
      (data.meccanici && data.meccanici.length ? data.meccanici : ["CAPO TEAM"]).forEach(m => document.getElementById('mechanic-select').add(new Option(m.toUpperCase(), m)));
      
      document.getElementById('category-select').innerHTML = '<option value="" disabled selected>CATEGORIA</option>'; 
      (data.categorie && data.categorie.length ? data.categorie : ["KART"]).forEach(c => document.getElementById('category-select').add(new Option(c.toUpperCase(), c)));
      
      document.getElementById('track-select').innerHTML = '<option value="" disabled selected>PISTA</option>'; 
      (data.circuiti && data.circuiti.length ? data.circuiti : ["PISTA"]).forEach(p => document.getElementById('track-select').add(new Option(p.toUpperCase(), p)));
      
      document.getElementById('session-select').innerHTML = '<option value="" disabled selected>TIPO PROVA</option>';
      (data.sessioni || ["PROVE LIBERE", "QUALIFICA", "GARA"]).forEach(s => { document.getElementById('session-select').add(new Option(s.toUpperCase(), s)); });

      ['mechanic', 'category', 'track', 'driver', 'session'].forEach(k => {
        let savedVal = localStorage.getItem('saved_' + k);
        let selectElem = document.getElementById(k + '-select');
        if(savedVal && selectElem) {
          for(let i=0; i<selectElem.options.length; i++) {
            if(selectElem.options[i].value === savedVal) {
              selectElem.selectedIndex = i;
              document.getElementById('label-' + k).innerText = savedVal.toUpperCase();
              break;
            }
          }
        }
      });

      if (!mantieniSchermataAttuale) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('mechanic-overlay').style.display = 'flex';
        document.getElementById('sub-info').innerText = isOffline ? "MODALITÀ OFFLINE" : "REGISTRATO";
      }
    }

    function caricaPaddockOffline(cod, autoLogin) {
      let cached = localStorage.getItem('saved_paddockData_' + cod);
      if (cached) {
        popolaPaddockDaDati(JSON.parse(cached), true, false);
        setTimeout(() => {
          if (navigator.onLine) verificaConnessioneERipulisciPaddock(true);
        }, 1500);
      } else {
        if (!autoLogin) alert("Nessuna connessione internet e nessun dato salvato sul telefono per questo codice. Effettua il primo accesso dove c'è rete!");
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('sub-info').innerText = "OFFLINE";
      }
    }

    function autenticaLicenza(autoLogin = false) {
      let cod = document.getElementById('codice-scuderia-input').value.toUpperCase().trim();
      if(!cod) return alert("Inserisci un codice scuderia valido!");
      
      codiceScuderiaAttivo = cod;

      if (!navigator.onLine) {
        caricaPaddockOffline(codiceScuderiaAttivo, autoLogin);
        return;
      }

      document.getElementById('sub-info').innerText = "CONNESSIONE IN CORSO...";
      
      fetch(MASTER_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getAppData", codiceScuderia: codiceScuderiaAttivo })
      })
      .then(res => res.json())
      .then(data => {
        if(data.error) {
          if(!autoLogin) alert("ERRORE: Codice Scuderia errato o scaduto!");
          localStorage.removeItem('saved_codiceScuderia');
          document.getElementById('login-overlay').style.display = 'flex';
          document.getElementById('sub-info').innerText = "PRONTO";
          return;
        }
        
        localStorage.setItem('saved_codiceScuderia', codiceScuderiaAttivo);
        localStorage.setItem('saved_loginTime', Date.now());
        localStorage.setItem('saved_paddockData_' + codiceScuderiaAttivo, JSON.stringify(data));

        popolaPaddockDaDati(data, false, false);
        sincronizzaCodaOffline(false);
      })
      .catch(() => {
        caricaPaddockOffline(codiceScuderiaAttivo, autoLogin);
      });
    }

    function confirmOverlayAll() {
      let m = document.getElementById('mechanic-select').value, c = document.getElementById('category-select').value, t = document.getElementById('track-select').value, d = document.getElementById('driver-select').value, s = document.getElementById('session-select').value;
      if(!m || !c || !t || !d || !s) return alert("Seleziona tutti i campi!");

      varMechanic = m; varCategory = c; varTrack = t;
      document.getElementById('pilota').value = d; document.getElementById('sessione').value = s;
      
      if (navigator.onLine) {
        fetch(MASTER_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getAppData", codiceScuderia: codiceScuderiaAttivo, pilotaSelezionato: d })
        })
        .then(res => res.json())
        .then(data => {
          aggiornaTitoloPaddockOnline(true);
          document.getElementById('best-val').innerText = data.best || "--:--.---"; 
          document.getElementById('ideal-val').innerText = data.ideal || "--:--.---";
        })
        .catch(() => {});
      }

    function toggleVoiceRecognition() {
      window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!window.SpeechRecognition) return alert("Riconoscimento vocale non supportato.");
      const statusLabel = document.getElementById('voice-status');
      const voiceBar = document.getElementById('voice-bar-btn');
      
      if (!isListening) {
        recognition = new SpeechRecognition();
        recognition.interimResults = false; recognition.continuous = true; recognition.lang = 'it-IT';
        document.getElementById('nota-vocale-testo').value = ""; 
        statusLabel.innerText = "ASCOLTO... PARLA ORA";
        voiceBar.classList.add('listening-active'); isListening = true;
        
        recognition.addEventListener('result', e => {
          const text = Array.from(e.results).map(result => result[0]).map(result => result.transcript).join('');
          document.getElementById('nota-vocale-testo').value = text;
          statusLabel.innerText = text.toUpperCase(); 
        });
        recognition.start();
      } else {
        if (recognition) { recognition.stop(); }
        voiceBar.classList.remove('listening-active'); isListening = false;
        setTimeout(() => {
          let notaFinale = document.getElementById('nota-vocale-testo').value;
          if (notaFinale && notaFinale.trim() !== "") {
            statusLabel.innerText = "NOTA REGISTRATA CON SUCCESSO!";
            voiceBar.style.border = "2px solid #00e676";
          } else {
            statusLabel.innerText = "PREMI E DETTA NOTE ASSETTO";
            voiceBar.style.border = "2px dashed #ff3d00";
          }
        }, 300);
      }
    }

      document.getElementById('rival-input').value = "";
      document.getElementById('rival-input').disabled = false;

    function press(tipo) {
      const ora = Date.now(); document.getElementById('beep').play();
      let nVocaleText = document.getElementById('nota-vocale-testo').value; 

      if (tipo === 'Home') {
        tInizio = 0; tUltimo = 0; splitCount = 0; lapCount = 0; tRivalInizio = 0; tRivalUltimo = 0;
        currentLapCum = {}; bestLapCum = {}; localRecords = {}; lapHistory = [];
        document.getElementById('lap-counter').innerText = "GIRO 0";
        document.getElementById('sub-info').innerText = navigator.onLine ? "PRONTO" : "MODALITÀ OFFLINE";
        aggiornaGraficoGiri();
        resetDeltaDisplay();
        resetSectorBars();
        resetRivalUI();
        document.getElementById('nota-vocale-testo').value = ""; 
        document.getElementById('voice-status').innerText = "PREMI E DETTA NOTE ASSETTO";
        document.getElementById('voice-bar-btn').style.border = "2px dashed #ff3d00";
        document.getElementById('mechanic-overlay').style.display = 'flex';
        verificaConnessioneERipulisciPaddock(true);
        return;
      }
      if (tipo === 'Stop') {
        tInizio = 0; tUltimo = 0; splitCount = 0; lapCount = 0; tRivalInizio = 0; tRivalUltimo = 0;
        currentLapCum = {};
        document.getElementById('lap-counter').innerText = "GIRO 0";
        document.getElementById('sub-info').innerText = "STOPPED"; document.getElementById('main-time').style.color = "#ffffff";
        resetDeltaDisplay();
        resetSectorBars();
        return;
      }
      if (tipo === 'Reset') {
        if (!confirm("Azzerare cronometro sul telefono?")) return;
        tInizio = 0; tUltimo = 0; splitCount = 0; lapCount = 0; localRecords = {}; lapHistory = [];
        currentLapCum = {}; bestLapCum = {};
        document.getElementById('lap-counter').innerText = "GIRO 0";
        document.getElementById('main-time').innerText = "00:00.000"; 
        document.getElementById('main-time').style.color = "#ffffff"; 
        document.getElementById('intertempo').innerHTML = "--:--.---"; 
        aggiornaGraficoGiri();
        resetDeltaDisplay();
        resetSectorBars();
        resetRivalUI();
        
        if (navigator.onLine) {
          fetch(MASTER_URL, { method: "POST", body: JSON.stringify({ action: "resetMemoria", codiceScuderia: codiceScuderiaAttivo }) })
          .then(res => res.json()).then(res => document.getElementById('sub-info').innerText = res.sub)
          .catch(() => document.getElementById('sub-info').innerText = "RESET LOCALE");
        } else {
          document.getElementById('sub-info').innerText = "RESET LOCALE (OFFLINE)";
        }
        return;
      }
      
      if (tipo === 'RivalStart') {
        let valInp = document.getElementById('rival-input').value.trim();
        rivalNumeroAttivo = valInp ? valInp : ""; 
        
        tRivalInizio = ora; tRivalUltimo = ora; rivalSplitCount = 0; 
        document.getElementById('rival-input').disabled = true; 
        document.getElementById('sub-info').innerText = "DUAL TRACKING";
        document.getElementById('rival-input-bar').style.display = 'none'; 
        document.getElementById('rival-giant-grid').style.display = 'grid';
        return;
      }
      
      if (tipo === 'RivalSplit' || tipo === 'RivalLap') {
        rivalSplitCount++; let dRival = ora - tRivalUltimo;
        let nomeRivalCompleto = rivalNumeroAttivo !== "" ? "RIVAL " + rivalNumeroAttivo : "RIVAL";
        
        if(tipo === 'RivalSplit') {
          tRivalUltimo = ora; 
          document.getElementById('r-split-label').innerText = "R-SPLIT " + rivalSplitCount; 
          document.getElementById('r-split-box').innerText = msToTime(dRival);
          
          inviaOAccodaDato({ 
            action: "registraDato", 
            tipo: 'RivalSplit', 
            colSplit: rivalSplitCount, 
            durataMs: dRival, 
            durataSplitMs: 0, 
            pilota: nomeRivalCompleto, 
            sessione: document.getElementById('sessione').value, 
            categoria: varCategory, 
            circuito: varTrack, 
            meccanico: varMechanic, 
            notaVocale: "", 
            codiceScuderia: codiceScuderiaAttivo 
          });
        } else {
          let dGiroR = ora - tRivalInizio; tRivalInizio = ora; tRivalUltimo = ora;
          document.getElementById('r-lap-box').innerText = msToTime(dGiroR); 
          document.getElementById('r-split-label').innerText = "R-SPLIT " + rivalSplitCount; 
          document.getElementById('r-split-box').innerText = msToTime(dRival);
          
          inviaOAccodaDato({ 
            action: "registraDato", 
            tipo: 'Lap1', 
            colSplit: rivalSplitCount, 
            durataMs: dGiroR, 
            durataSplitMs: dRival, 
            pilota: nomeRivalCompleto, 
            sessione: document.getElementById('sessione').value, 
            categoria: varCategory, 
            circuito: varTrack, 
            meccanico: varMechanic, 
            notaVocale: "", 
            codiceScuderia: codiceScuderiaAttivo 
          });
          rivalSplitCount = 0;
        }
        return;
      }
      
      if (tInizio === 0) { 
        tInizio = ora; tUltimo = ora; splitCount = 0; lapCount = 1;
        currentLapCum = {};
        resetDeltaDisplay();
        resetSectorBars();
        document.getElementById('lap-counter').innerText = "GIRO " + lapCount;
        document.getElementById('sub-info').innerText = navigator.onLine ? "TRACKING..." : "TRACKING (OFFLINE)"; 
        return; 
      }
      let durata = 0, dSplit = 0, display = document.getElementById('main-time'), inter = document.getElementById('intertempo');
      let deltaEl = document.getElementById('lap-delta');
      
      // 🏎️ GESTIONE COLORI INTELLIGENTI + BARRETTE S1-S8 + DELTA CUMULATIVO LIVE
      if (tipo === 'Split') {
        if (resetBarsTimer) { resetSectorBars(); }
        splitCount++;
        let tempoCumulativo = ora - tInizio;
        durata = ora - tUltimo; 
        tUltimo = ora; 
        display.innerText = msToTime(durata); 
        inter.innerHTML = "SPLIT " + splitCount + "<br>" + msToTime(durata);
        
        currentLapCum[splitCount] = tempoCumulativo;
        if (bestLapCum[splitCount] !== undefined) {
          let diff = tempoCumulativo - bestLapCum[splitCount];
          deltaEl.innerText = "DELTA S" + splitCount + ": " + formatDelta(diff);
          deltaEl.style.color = diff < 0 ? "#00e676" : (diff > 0 ? "#ff9100" : "#ffffff");
        } else {
          deltaEl.innerText = "RIF. S" + splitCount + ": " + msToTime(tempoCumulativo);
          deltaEl.style.color = "#aaa";
        }

        let bestSp = localRecords['S' + splitCount] || 999999999;
        let coloreSettore = "#ff9100";
        if (durata <= bestSp) {
          coloreSettore = "#00e676";
          localRecords['S' + splitCount] = durata;
        } else if (durata <= (bestSp + 100)) {
          coloreSettore = "#ffffff";
        }
        display.style.color = coloreSettore;
        setSectorBarColor(splitCount, coloreSettore);

        inviaOAccodaDato({
          action: "registraDato",
          tipo: 'Split',
          colSplit: splitCount,
          durataMs: durata,
          durataSplitMs: 0,
          pilota: document.getElementById('pilota').value,
          sessione: document.getElementById('sessione').value,
          categoria: varCategory,
          circuito: varTrack,
          meccanico: varMechanic,
          notaVocale: nVocaleText,
          codiceScuderia: codiceScuderiaAttivo
        });
      } else if (tipo === 'Lap1') {
        if (resetBarsTimer) { resetSectorBars(); }
        splitCount++; 
        dSplit = ora - tUltimo; 
        durata = ora - tInizio; 
        tInizio = ora; 
        tUltimo = ora; 
        display.innerText = msToTime(durata); 
        inter.innerHTML = "S" + splitCount + ": " + msToTime(dSplit) + "<br>LAP: " + msToTime(durata);
        
        currentLapCum['LAP'] = durata;
        if (bestLapCum['LAP'] !== undefined) {
          let diffLap = durata - bestLapCum['LAP'];
          deltaEl.innerText = "DELTA GIRO: " + formatDelta(diffLap);
          deltaEl.style.color = diffLap < 0 ? "#00e676" : (diffLap > 0 ? "#ff9100" : "#ffffff");
        } else {
          deltaEl.innerText = "GIRO RIFERIMENTO";
          deltaEl.style.color = "#aaa";
        }

        let bestUltimoSp = localRecords['S' + splitCount] || 999999999;
        let coloreUltimoSettore = "#ff9100";
        if (dSplit <= bestUltimoSp) {
          coloreUltimoSettore = "#00e676";
          localRecords['S' + splitCount] = dSplit;
        } else if (dSplit <= (bestUltimoSp + 100)) {
          coloreUltimoSettore = "#ffffff";
        }
        setSectorBarColor(splitCount, coloreUltimoSettore);

        resetBarsTimer = setTimeout(resetSectorBars, 1200);
        
        // Aggiorna lo storico grafico con il giro appena concluso prima di passare al successivo
        lapHistory.push({ lap: lapCount, ms: durata });
        aggiornaGraficoGiri();

        lapCount++;
        document.getElementById('lap-counter').innerText = "GIRO " + lapCount;
        
        let bestLap = localRecords['LAP'] || 999999999;
        if (durata <= bestLap) {
          display.style.color = "#00e676";
          localRecords['LAP'] = durata;
          bestLapCum = Object.assign({}, currentLapCum);
        } else if (durata <= (bestLap + 100)) {
          display.style.color = "#ffffff";
        } else {
          display.style.color = "#ff9100";
        }
        currentLapCum = {};
        
        inviaOAccodaDato({
          action: "registraDato",
          tipo: 'Lap1',
          colSplit: splitCount,
          durataMs: durata,
          durataSplitMs: dSplit,
          pilota: document.getElementById('pilota').value,
          sessione: document.getElementById('sessione').value,
          categoria: varCategory,
          circuito: varTrack,
          meccanico: varMechanic,
          notaVocale: nVocaleText,
          codiceScuderia: codiceScuderiaAttivo
        }, (data) => {
          if (data.miglior) document.getElementById('best-val').innerText = data.miglior;
          if (data.ideal) document.getElementById('ideal-val').innerText = data.ideal;
        });

        splitCount = 0; 
        return;
      }
    }

    function comandoFoglioRemoto(azione) {
      if (!codiceScuderiaAttivo) return alert("Codice scuderia non attivo!");
      let msgConferma = "";
      if (azione === 'salvaFoglioTeam') {
        msgConferma = "Vuoi SALVARE tutti i giri del foglio team nell'Archivio Generale?";
      } else if (azione === 'salvaECancellaFoglioTeam') {
        msgConferma = "Vuoi SALVARE tutti i giri nell'Archivio Generale e subito dopo PULIRE la schermata CRONOMETRO?";
      } else {
        msgConferma = "ATTENZIONE: Vuoi CANCELLARE tutti i giri dalla schermata CRONOMETRO senza salvarli?";
      }

      if (!confirm(msgConferma)) return;

      let subEl = document.getElementById('sub-info');
      if (subEl) subEl.innerText = navigator.onLine ? "ESECUZIONE SUL FOGLIO..." : "ACCODATO OFFLINE";

      inviaOAccodaDato({
        action: azione,
        codiceScuderia: codiceScuderiaAttivo
      }, (data) => {
        if (data && data.message) {
          alert(data.message);
          if (subEl) subEl.innerText = data.message.split("\n")[0];
        }
      });
    }

    function msToTime(s) {
      let ms = s % 1000; s = (s - ms) / 1000; let secs = s % 60; let mins = (s - secs) / 60;
      return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs + '.' + (ms < 100 ? (ms < 10 ? '00' : '0') : '') + ms;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
